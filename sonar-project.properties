# SonarQube / SonarCloud project configuration for Reclaim
sonar.projectKey=reclaim-monorepo
sonar.projectName=Reclaim
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=server/src,client/src
sonar.tests=server/src,client/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/playwright-report/**,**/recordings/**,**/*.config.ts,**/*.config.mjs

# Encoding
sonar.sourceEncoding=UTF-8

# Test Coverage (LCOV)
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info
