name: Scheduled CI (Fast - No E2E)

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

concurrency:
  group: scheduled-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Lint & Unit/Component Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: reclaim_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres@localhost:5432/reclaim_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_jwt_secret_key_at_least_32_chars_long_123456
      JWT_REFRESH_SECRET: test_refresh_jwt_secret_at_least_32_chars_123
      RAZORPAY_KEY_ID: rzp_test_dummy_key_id_123
      RAZORPAY_KEY_SECRET: rzp_test_dummy_secret_123
      RAZORPAY_WEBHOOK_SECRET: rzp_test_dummy_webhook_secret_123
      GEMINI_API_KEY: dummy_gemini_test_api_key
      PORT: 4000
      CLIENT_URL: http://localhost:5173

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (Node 24 runner)
        with:
          version: 10

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🗄️ Generate Prisma Client & Migrate Schema
        run: |
          pnpm run db:generate
          pnpm run db:push
          pnpm run db:seed

      - name: 🔍 Lint Codebase (ESLint)
        run: pnpm run lint:eslint

      - name: 🏷️ Typecheck Codebase (TypeScript)
        run: pnpm run lint:types

      - name: 🔒 Security Audit Dependencies
        run: pnpm audit --audit-level=high || true

      - name: 🧪 Run Backend Unit & Integration Tests
        run: pnpm --filter server test

      - name: ⚛️ Run Frontend Component Tests
        run: pnpm --filter client test
